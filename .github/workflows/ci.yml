name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  approval:
    # A pull request that the maintainer did not open and push waits for the
    # maintainer's approval of the `pull-request-ci` environment before any
    # job runs its code.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login != 'ctolon' || github.actor != 'ctolon')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pull-request-ci
    steps:
      - run: echo "Approved by a maintainer."

  checks:
    # Lint and the tests that need no services; measurements run on a
    # dedicated host, never in CI.
    needs: approval
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
      - name: Install the locked environment
        run: |
          uv venv --python 3.14 .venv
          uv pip sync --python .venv/bin/python requirements.lock
          uv pip install --python .venv/bin/python --no-deps -e .
          uv pip install --python .venv/bin/python --group dev
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q
        env:
          BENCH_DATABASE: sqlite
      - name: Test the HTTP fixture
        run: go -C infra/http test ./...
