; Local benchmark only: fixed database/user allowlist, no wildcard routing.
[databases]
aiodrf_benchmarks = host=postgres port=5432 dbname=aiodrf_benchmarks user=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/pgbouncer-users.txt
admin_users = bench
pool_mode = transaction
default_pool_size = 50
min_pool_size = 50
reserve_pool_size = 0
max_client_conn = 256
max_db_connections = 50
max_prepared_statements = 200
query_wait_timeout = 2
server_idle_timeout = 600
server_lifetime = 3600
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
pidfile = /tmp/pgbouncer.pid
unix_socket_dir = /tmp
